apiVersion: repoctopus/v1alpha1
kind: RepoctopusWorkspace
workspace:
  id: example-project
  repositoryId: workspace
repositories:
  - id: workspace
    path: .
  - id: app
    path: ../app
# 可选。在 Workspace 的共享配置中设置 OTLP/HTTP URL，开启团队遥测。
# telemetry:
#   endpoint: https://signoz-collector.example.internal
composition:
  plugins: []
profiles:
  - id: verify
    nodes:
      - id: app-build
        type: command
        repository: app
        executable: npm
        args: [run, build]
        # 用于正式 Verify 前，按真实验收范围填写 covers。
        # 例如 covers: ['task:1.1'] 仅适用于这个构建能证明任务 1.1 的验收条件时。
evidence:
  retention:
    maxAgeDays: 30
    minRecentSuccesses: 1
delivery:
  checkpoint:
    automatic: true
    protectedBranches:
      - main
      - master
      - release/*
    commitMessagePattern: '^(feat|fix|docs|refactor|test|chore)(\([a-z0-9-]+\))?: .+'
    quickChecks:
      '*': []
  publication:
    remote: origin
    provider: github
    githubApiBaseUrl: https://api.github.com
    mrTitleTemplate: '{{changeId}}'
    mrBodyTemplate: '{{verificationReport}}'
    apiCredential:
      provider: environment
      variable: REPOCTOPUS_GITHUB_TOKEN
# 使用默认 Skill Provider，包含工作流 Action、Matt Skills 和项目 Skill。
# 可选。先创建 .agents/skills/team-api-review/SKILL.md，再启用对应绑定。
# lifecycle:
#   skillBindings:
#     schemaVersion: 1
#     bindings:
#       - id: team-api-review
#         target: build.check
#         role: guidance
#         skill: team-api-review
#         order: 20
specificationProvider:
  id: specification-openspec
  store:
    id: team-platform
    repositoryId: workspace
