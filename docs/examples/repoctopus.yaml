apiVersion: repoctopus/v1alpha1
kind: RepoctopusWorkspace
workspace:
  id: example-project
  repositoryId: workspace
repositories:
  - id: workspace
    path: .
  - id: app
    path: ../app
# 可选。用协调仓中的一个 OTLP/HTTP URL 开启团队遥测。
# telemetry:
#   endpoint: https://signoz-collector.example.internal
composition:
  plugins: []
profiles:
  - id: verify
    nodes:
      - id: app-build
        type: command
        repository: app
        executable: npm
        args: [run, build]
evidence:
  retention:
    maxAgeDays: 30
    minRecentSuccesses: 1
delivery:
  checkpoint:
    automatic: true
    protectedBranches:
      - main
      - master
      - release/*
    commitMessagePattern: '^(feat|fix|docs|refactor|test|chore)(\([a-z0-9-]+\))?: .+'
    quickChecks:
      '*': []
  publication:
    remote: origin
    provider: github
    githubApiBaseUrl: https://api.github.com
    mrTitleTemplate: '{{changeId}}'
    mrBodyTemplate: '{{verificationReport}}'
    apiCredential:
      provider: environment
      variable: REPOCTOPUS_GITHUB_TOKEN
skillProviders:
  - id: skill-provider-matt
  - id: skill-provider-filesystem
lifecycle:
  skillBindings:
    schemaVersion: 1
    bindings:
      - id: team-design-guidance
        target: specification.plan
        role: guidance
        skill: team-code-guidance
        order: 20
      - id: team-design-method
        target: specification.plan
        role: augmentation-replacement
        skill: team-codebase-design
        slot: design-method
        order: 10
specificationProvider:
  id: specification-openspec
  store:
    id: team-platform
    repositoryId: workspace
