apiVersion: repoctopus/v1alpha1
kind: RepoctopusWorkspace
workspace:
  id: unsafe-secret-fixture
  repositoryId: workspace
repositories:
  - id: workspace
    path: .
profiles:
  - id: post-merge
    nodes:
      - id: verify
        type: command
        repository: workspace
        executable: npm
        args: [run, verify]
platformEvents:
  storeProvider:
    id: platform-events-file
  http:
    hostname: 127.0.0.1
    port: 7341
  github:
    source: primary
    path: /webhooks/github
    webhookCredential: raw-webhook-secret
    apiCredential:
      provider: environment
      variable: REPOCTOPUS_GITHUB_TOKEN
  runner:
    identity: primary-runner
