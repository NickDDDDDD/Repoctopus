              handoffHash: b32b914fd864f9ae5667803680d51be2c125f3c7148b07c9a11cee38f6659d4b
              proposal: 修订方案：独立 Verify 审查确认 POSIX recovered termination 只观察 leader PID，会在
                leader 消失但同一 process group 的 descendant 仍存活时错误返回
                terminated。采用同模块已有的 waitForPosixGroupExit：发送破坏性信号前继续用 leader
                creation identity 授权，发送后只以 kill(-pgid, 0) 返回 ESRCH 证明整组退出；超时或
                EPERM 保持 unknown。新增 leader-not-running/group-still-alive 的真实
                RED，并运行 terminate-process-tree 与 service-recovery 回归。拒绝在
                ownership 轮询上叠加第二套 group 算法，也拒绝枚举 /proc/ps。同步把已由 GitHub
