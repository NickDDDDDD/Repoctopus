                  test/platform/process/owned-command-termination.test.ts，在
                  GitHub Linux 使用真实 detached parent/descendant fixture，任何
                  terminated 成功都必须对应父进程和后代实际停止，finally 强制清理全部 PID。同步把 GitHub
                  已证明的两项门禁决定写入唯一 design.md：CI 完整历史用于 tested commit
                  ancestry；package-content v2 排除 host-derived tar mode，但继续绑定
                  path、entry type、file size/content digest 与 link target。仍
                  skip_specs，不改变公共 API、Runtime 状态机、桌面支持范围或产品需求。完成后重跑 Windows
                  全量、GitHub Linux 精确 HEAD，并让独立 reviewer 补审 process-group 与
                  canonical 文档差异。
