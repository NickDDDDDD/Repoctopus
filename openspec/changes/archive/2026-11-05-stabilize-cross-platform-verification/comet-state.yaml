                recovered termination 在有界条件轮询确认退出后才返回 terminated，超时保持 unknown。既有
                product-distribution、desktop-observability-dashboard、feedback-collection
                与 managed-work-execution 已覆盖行为，继续 skip_specs，不修改 Engine、Cordis
                Service、Runtime 状态机、OTLP schema、公共 CLI 或正式桌面平台范围。相关 Vitest 保存
                TDD 证据，本地 Windows npm run verify 与 GitHub Linux PR verify
                共同构成最终验证；若远端仍失败则保留 change 开放，不绕过门禁合入。主要风险是批量夹具替换改变语义与 POSIX
                zombie 时序；分别通过统一工厂保持拓扑断言、基于状态的有界确认和保守超时结果控制。
