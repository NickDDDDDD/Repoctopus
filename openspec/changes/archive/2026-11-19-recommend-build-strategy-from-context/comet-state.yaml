            proposal: 由当前Design
              Work根据实际任务范围、依赖、宿主能力和测试切面，分别推荐execution与TDD；Runtime校验类型化build-strategy-candidate，保留未决启动偏好且不补默认。同一Design
              gate等待CAS保存候选、原请求和来源，现有Design决定一次绑定稳定策略与规划；原审批receipt先写入而Run接受中断时重验并采用原结果，不重复审批。Configure只验证ExecutionBinding，现有Strategy与Binding身份分离、实际TDD与委派证据保持。spec
              approval prepare绑定--run消除另一条默认和硬编码current路径；run
              revise-strategy仅表达明确修订意图，Runtime在无在途未知执行的安全Design/Build/Verify边界返回受管Design，仍须当前批准，不直接切换模式。保持两种execution、两种TDD、standard
              Review、五阶段、两次正常审查和原OpenSpec/Matt权威。代价为调整公开缺参行为及Design结果协议，不兼容旧开发checkpoint；不引入分类器、新profile或Comet
              SDK。验证四组合、纠正补交、能力阻断、决定响应丢失及真实候选安装包多仓从Init到Archive、首包冷恢复和发布去重。独立builder
              check无重要未决；没有Spec
              Patch，8项任务仍在已批准Open范围内。建议本次实施采用autonomous、TDD、thorough和现有worktree，尚待用户对当前设计及该配置作明确决定。
