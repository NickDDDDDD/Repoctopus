            proposal: 用户已选择B并委托Agent代理中间确认。方案：同一Change修复Windows受管Archive
              Git长路径，以及原Run跨实现恢复。保留冻结Archive来源、原规划审批、Verify
              Input/Gate/Bundle和Journal；由现有组合权威精确采纳当前实现，补齐Archive真实Provider依赖，在既有受保护入口核对最新Run/Work/epoch/input/composition，从可信状态形成进程内执行上下文供Delivery核验。不用历史来源要求当前代码完全相同，不直接换冻结摘要，不新增持久授权协议或通用兼容层。Windows只在受管Git子进程用命令级长路径配置，不改宿主持久配置、目录布局或检查argv。已按用户B选择更新Spec
              Patch，增加Archive执行组合与冻结来源分离的契约，原路径/隔离要求保持，12项任务。真实生产回归禁止mock核心校验；修复包必须公开接续原失败多仓Run，核对无重复审批/Verify/MR及冷恢复。独立Builder复核无阻断。风险：不兼容实现、执行前漂移、未知副作用与底层路径失败继续阻断。采用autonomous+TDD+thorough，沿用当前worktree。修复CI通过后归档创建PR合入main，再以main包验证并按授权继续修复直到通过。
