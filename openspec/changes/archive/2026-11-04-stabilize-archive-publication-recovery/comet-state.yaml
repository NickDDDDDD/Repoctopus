            proposal: 采用单一外部执行确定性合同：GitHub 4xx 明确拒绝映射为 not-applied，5xx、传输中断、2xx
              解析失败和创建后核验失败映射为 unknown；Delivery 以 PublicationNotAppliedError 与
              PublicationResultUnknownError 分流，Journal 对 not-applied 原子回到同一
              stable intent 的 pushed checkpoint 且仅允许下一次显式 pull 最多再 create 一次，对
              unknown 永久保持 observation-only；WorkflowRuns 只把 unknown 投影为
              external-result-unknown。completed Run 的 done/terminal 在 trajectory
              replay 前短路，非终态历史 selection 必须精确匹配当前 revision、epoch、work 和
              attempt。验证采用失败注入、Journal 重启恢复、打包 CLI 和第五轮 terminal
              fixture，不访问真实平台、不新增 daemon/webhook/auto-merge/compat layer。
