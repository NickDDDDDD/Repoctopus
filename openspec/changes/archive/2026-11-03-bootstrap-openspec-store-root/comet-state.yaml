      - id: bootstrap-openspec-store-root:6
        stepId: full.design.confirm
        sequence: 6
        status: resolved
        proposal:
          input:
            change: bootstrap-openspec-store-root
            changeDir: openspec/changes/bootstrap-openspec-store-root
            workspaceBaseline:
              ref: 87651f74-b019-40f2-84cf-b13ae47fe714
          outputs:
            full.design.handoff:
              handoffContext: openspec/changes/bootstrap-openspec-store-root/.comet/handoff/design-context.json
              handoffHash: 0c9375b366cf2d3645ca95ccb35f55bc748e4f3451ed8804423d68d2e63e912e
              proposal: >-
                推荐采用“Repoctopus 原生可恢复 onboarding 事务”方案：


                1. 在获批候选中冻结五种 Root disposition、固定 OpenSpec 1.14.3
                identity、Workspace/Store identity 与允许动作；apply 前重新观察，漂移即使决定失效。

                2. 复用现有 request-scoped Store binding journal，新增 prepare-root
                Intent/Receipt 和受限 openspec/ ownership manifest，不建立第二套 lifecycle
                或 generation。

                3. missing-root 才执行固定 entry 的官方 init；healthy-unregistered 只
                register；partial/unhealthy 和 registry conflict 一律 fail closed。

                4. 外部结果未知时只从 Intent、当前 Root/registry 和 manifest 重新观察；不依赖
                stdout、不重复创建、不自动删除或覆盖用户文件。

                5. 发布顺序固定为 prepare-root -> register-store -> business pointers
                -> repoctopus.yaml，配置最后发布。

                6. 真实 CLI 测试使用临时 XDG_DATA_HOME/XDG_CONFIG_HOME 隔离 Windows
                registry/config，并验证真实用户 registry 未变化。


                拒绝的替代方案：

                - 只在 ensureRegistered 中加“目录不存在就 init”：缺少批准身份、checkpoint 与未知结果恢复。

                - 直接复制 Comet initialization 子系统：会带入其单仓/Classic 状态模型，与 Repoctopus
                Store、多仓 pointer 和现有 journal 重叠。

                - 使用 openspec store setup：职责过重，并会拒绝已有内容但不健康的仓，无法提供所需的分步审计。

                - 手工创建 openspec/config.yaml：复制 Provider 私有协议，升级时会漂移。


                实现边界以当前 design.md 和两个 delta spec 为准；普通实现细节可以在不扩大行为权限的前提下细化，但
                Root 状态分类、配置最后发布、用户文件保护和真实 CLI 验收不可弱化。
