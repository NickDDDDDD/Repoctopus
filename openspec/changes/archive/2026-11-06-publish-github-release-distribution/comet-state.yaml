            handoffHash: 7ff282e7b776b6fff63a1e7929be14600b73f4c64ab25db1d4a2f651c9ed9efe
            proposal: 采用单个仅由官方仓库 main 手动触发的 workflow，分 Prepare 和 Publish。Prepare 核对完整 SHA
              在远端 main 历史、ci.yml 的 main push 和同 SHA verify 成功、Tag 与 package.json
              版本匹配；Windows 只读作业打包一次，现有 CLI 协议测试消费候选 tarball，空缓存 npx 从源码外启动，同一
              EXE 走安装、激活、卸载并校验回执摘要，桌面校验按 package.json
              版本识别。写权限仅用于草稿和公开步骤。候选工件保存三份发布资产及独立来源记录，按成功 Prepare Run
              和工件身份取得原始字节，不重新构建代替。Prepare 核对 Tag、目标和现有资产，只为相同候选补传缺项并重新核对。Publish
              显式选择同一候选，重新核对来源、草稿、Tag 和三份资产后公开预发布；完整已发布结果可复用，冲突、来源或摘要不明时停止，保留原有
              Tag 和资产。README 使用固定 URL 的 npx，保留本地 tarball 路径，公开后用匿名 URL
              和空缓存复验。手工构建缺少一致来源证明，每次合入自动发布无法表达版本授权。Windows
              验收失败、候选工件过期、草稿漂移均阻止公开。九项任务覆盖实施与候选验收，无 Spec Patch；首版公开和真实 URL
              验收在合入后执行。
