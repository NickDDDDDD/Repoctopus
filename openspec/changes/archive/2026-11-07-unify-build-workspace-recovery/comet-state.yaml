                  后只解除可归属的冲突。Spec Patch 基于用户明确批准的未授权分支阻断要求，在
                  managed-work-execution 中补齐已授权兼容重绑定的前置条件，同时保留原 protected Plan
                  correction 路径。公开 CLI 的 nextActions 与 continuation
                  取自有效恢复结论，原始启动快照 diff 仅作诊断。以公开 CLI
                  的全新进程覆盖两个调用顺序、重复恢复、未授权分支、切回、未知 invocation 和未接受 HEAD，在真实四业务仓加
                  Workspace 的实验项目完成首包后的续跑和第二包执行，保存可审查证据。采用 Comet 0.5.1 的绑定与
                  checkpoint 恢复方案，通过当前 Cordis 架构实现。主要风险是过宽接纳分支、未知 Git
                  进度被误接纳和过期观察清除新冲突，分别以绑定验证、原 acceptance 权威和 revision-bound
                  更新控制。详见当前 design.md，独立 Builder Check 已确认无实质规划缺口。
