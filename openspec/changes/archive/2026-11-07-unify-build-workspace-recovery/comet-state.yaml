            full.design.handoff:
              handoffContext: openspec/changes/unify-build-workspace-recovery/.comet/handoff/design-context.json
              handoffHash: 57eda9e25ec5c9fdf8c9536e9bf15eec84103d8d1afc7f3202fd968223a6384d
              proposal: 两个入口共用当前 Build 工作区恢复判定。Cordis 服务负责实时 Git 观察与受保护 Run 更新，领域规则核对已批准
                workspace intent、当前 ExecutionBinding 和最近已接受的
                BuildWorkspaceCheckpoint。resume 在启动快照 reconciliation
                写入阻塞前使用该判定，next 在返回当前 Work、接受 candidate 或派发 Host 前使用同一判定。合法恢复保留原
                Run、Strategy、Binding、Plan、已完成工作包和执行证据。未知 invocation、待接受提交与 HEAD
                进度仍由原 Work 执行和 acceptance 协议处理，恢复不能自行提升
                checkpoint。逐仓发现未授权分支、路径、worktree、远端或拓扑变化时保留现场并阻断，恢复原 checkout
                后只解除可归属的冲突。Spec Patch 基于用户明确批准的未授权分支阻断要求，在
                managed-work-execution 中补齐已授权兼容重绑定的前置条件，同时保留原 protected Plan
                correction 路径。公开 CLI 的 nextActions 与 continuation
