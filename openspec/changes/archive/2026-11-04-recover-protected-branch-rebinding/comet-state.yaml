            proposal: 候选 A（推荐）：建立 typed authorized-protected-branch-rebind evidence，从
              rejected build-plan-candidate、精确 write scopes、旧 Execution
              Binding、protected policy 与前后 snapshots 证明合法修正；next 与 resume 共用
              classifier，并在原子转换中清除仅与该授权匹配的 reconciliation poison、提升 epoch、精确失效旧
              Plan、派发唯一 build.configure。候选 B：通用 reconciliation 忽略 branch
              drift，风险是未知 checkout 漂移可绕过写入安全，拒绝。候选 C：仅文档要求 Host 永远调用
              next，无法覆盖进程重启和断点恢复，拒绝。主要风险是授权范围过宽或并发重复恢复；通过 exact
              write-set、branch-only diff、typed digest、fail-closed 负例和幂等
              checkpoint 测试控制。Spec Patch 已在 managed-work-execution 中授权：同一 Run
              恢复，Runner 保留 Git 副作用责任，path/remote/topology/无关 branch 等变化继续
              reconciliation。
