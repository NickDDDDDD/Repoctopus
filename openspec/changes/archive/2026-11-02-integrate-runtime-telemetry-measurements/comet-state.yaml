            handoffHash: b4be3b51cf5f1ca937041f56f7cd7183811dbe97ab0da26f6c141642723a537b
            proposal: 推荐采用 canonical directory-first projection：保留每个已持久化领域事实的一份 canonical
              envelope，由唯一机器目录驱动唯一 OTLP projection；同一编码同时保留 Desktop 可逆 envelope
              属性并输出 SigNoz 可查询的标准 Resource、允许列表 Event/Span attributes 与有界
              Metrics，Desktop 和远端只允许 endpoint、认证及独立 Delivery Cursor 不同。保留
              observationDestinationsFromEnvironment 的目的地所有权，补齐按信号
              header/timeout、OTEL_SERVICE_NAME 与 OTEL_RESOURCE_ATTRIBUTES
              优先级。Skill outcome 和 Rule evaluation 必须先形成稳定 additive domain
              fact，exporter 不根据相邻事件或最终状态推断。22 项指标中 9 项以
              direct/derived/optional-evaluator 方式支持，13 项明确为外部系统范围，缺失保持
              unknown；数据字典由机器目录生成并防漂移。旧直连 OpenTelemetry exporters 没有生产
              composition 调用者且绕过 outbox，先迁移其有效测试再删除，不为未发布入口保留兼容层。放弃两套 exporter
              并存，因为会产生两套 mapping/重试/字段权威；放弃只查询 JSON
              envelope，因为无法提供可移植原生查询和低基数约束。主要风险是 payload 增长、删除旧测试覆盖、OTLP
              环境优先级和双目的地语义漂移，分别以体积/隐私/基数测试、先迁移后删除、表驱动配置测试和 dual-destination E2E
              控制。无需 Spec Patch：当前主规格已要求每个领域事实一份 canonical envelope、同一
              mapping/payload 服务 Desktop 与远端且目的地不得重新解释。
