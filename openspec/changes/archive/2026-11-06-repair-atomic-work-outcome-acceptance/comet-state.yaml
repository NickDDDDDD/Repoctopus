                Outcome、Receipt 与 validation record；可纠正错误保留原 claim/invocation
                并使用新 submission ID；processing error 保留 pending；只有未知执行结果进入
                reconciliation。


                新增清单的完成条件是删除旧特判和延迟名单，并确保四类 Build Work 只经过统一接受入口。它不引入兼容路径、schema
                migration、第二套规格、implementation notes 或 ADR，也不改变 `skip_specs` 决定。


