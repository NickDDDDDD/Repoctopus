                proposal: >-
                  # Revised Design Summary


                  本次 revise-design 不改变此前已批准的目标、边界、处理顺序或 Spec。唯一新增内容是 `design.md`
                  的“迁移前接受入口清单”，把实现前已核对的生产入口写成可审计事实：ManagedWorkExecutor 的
                  embedded/external/reconcile 三个入口、Configure 特判、Plan/Check
                  延迟名单、WorkflowRuns 四类 Build 分支，以及 bindOutcome/markValidated
                  两步终态化。


                  设计仍保持：所有成功 Build submission 先 pending；统一 coordinator
                  按身份/协议、schema、领域语义、validator 和 transition feasibility
                  处理；正确候选由单一 guarded commit 绑定 accepted submission、Host/Action
                  Outcome、Receipt 与 validation record；可纠正错误保留原 claim/invocation
                  并使用新 submission ID；processing error 保留 pending；只有未知执行结果进入
                  reconciliation。


                  新增清单的完成条件是删除旧特判和延迟名单，并确保四类 Build Work
                  只经过统一接受入口。它不引入兼容路径、schema migration、第二套规格、implementation notes
                  或 ADR，也不改变 `skip_specs` 决定。


