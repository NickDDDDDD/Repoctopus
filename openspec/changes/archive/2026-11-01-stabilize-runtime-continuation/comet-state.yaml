            proposal: 候选设计：以类型化身份 basis 和代码固定的依赖矩阵拆分 planning
              semantic、approval、composition、Build
              configuration/plan、execution、verification 与 publication；纯领域
              invalidation planner 只退役实际依赖变化身份的事实，Design 返工保留不可调度的 Build
              候选并在新批准后逐层重验；continuation 只由 revision-bound checkpoint/CAS
              投影，未知副作用先 reconcile；composition 使用精确直接前驱 adoption 或
              migration_required；Trajectory/OTLP 记录失效范围与重复派发抑制。取舍：不建设通用 identity
              graph/规则引擎，不从 trajectory 重建当前状态，不以重复人工批准代替技术兼容性；用显式 reducer
              和较多契约测试换取可审计性与首版稳定性。风险：错误保留陈旧 completion、suspended Build
              双权威、adoption 滥用和遥测基数；分别通过完整输入匹配且默认 fail closed、current phase/Work
              唯一调度权、精确单前驱 adoption、低基数 labels 控制。Spec Patch：无；Open
              已批准的行为契约不变，本阶段只收敛实现设计与任务表。
