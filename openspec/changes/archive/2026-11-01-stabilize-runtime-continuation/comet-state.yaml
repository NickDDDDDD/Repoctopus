                proposal: 候选设计复核：保持已批准的分层身份、精确失效、稳定 continuation、精确 composition adoption、unknown
                  side-effect reconciliation 与同源遥测方案；唯一实质修订是删除未接入生产路径的独立
                  invalidation planner，把分类、disposition 与推进权收敛到 lifecycle
                  reducer，并仅由纯 runtimeInvalidationScope 计算固定依赖闭包，通过
                  commitGuarded CAS 原子提交。这样消除第二套权威，且与最终实现、测试和独立 review 一致。取舍：领域
                  reducer 承担更多显式分支，但换取可追踪、可穷尽、无脱节 planner 的状态推进。风险继续由默认 fail
                  closed、suspended Build 不可调度、精确直接前驱 adoption、unknown 先 observe
                  及低基数遥测控制。Spec Patch：无；Open 已批准行为不变。48 项任务、完整 verify
                  和独立高风险复核均已通过。
