            proposal: 推荐方案：采用三层 fail-fast。项目探测为生成的 required 命令写入可审查的 covers:['*']
              候选；项目接入只对约定默认 verify Profile 做静态可用性门禁；具体 Run 在 Planning Snapshot
              形成后、Design 审批请求持久化前，用实际 verificationProfileId 和 Tasks 执行纯 coverage
              preflight。SpecificationPlanning 通过副作用前 preflight hook 编排，preflight
              后重新核对 planning manifest identity；Evidence Coordinator 提供不计算仓库
              fingerprint 的 compile 入口；Design 与正式 Verify 复用同一纯
              resolver。拒绝两个替代方案：仅在 Build Check 后校验仍然过晚；在接入阶段强制所有 Profile 或猜测细粒度
              selector 会混淆独立 Evidence Profile 并伪造未来语义。
