                publication provenance 分区；任务复选框和证据提交不使获批 Build Protocol
                失效。Evidence 按声明依赖图精确失效，基础设施不可用不回退 Build 或 Design。Specification
                Provider 在 Open/Design 前置解析 Requirement identities 与 closure
                feasibility；Plan Validator 前置验证 TDD Package 闭包和授权包络。保留
                Repoctopus 的 OpenSpec、多仓 Binding、外部 Host、Cordis 与 OTLP 架构，只借鉴
                Comet 0.5.1 的 Runtime 权威、恢复顺序、checkpoint 延续和增量失效，不引入 Comet
                SDK。当前 Spec Patch 即 change 内已严格校验的 delta；不新增第二套规格或兼容旧
                lifecycle。主要风险为 authority 输入漏分区、错误失效扩散和重复恢复，已由 118 项聚焦测试、6
                个真实多仓场景及 189 文件完整矩阵覆盖。
