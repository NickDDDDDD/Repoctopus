            proposal: 参考固定 Comet Classic 的已批准交付目标和同一 Run 恢复。Runtime 通过冻结策略摘要校验后，把同一份必填
              DeliveryPolicy 传给业务与规格发布。Delivery 复用 GitHub 客户端构造，API 目标取自策略，凭据由
              Workspace 装配，此次核对的是客户端请求基址。以原候选包的精确直接前驱采纳新实现，保留审批、Bundle、Closure 和
              Journal。用原两条五仓 Run 复验，普通轮复用两个已创建业务 PR 和规格分支 OID，只补一个规格
              PR，返工轮完成三项发布，两条冷恢复均返回 completed。覆盖配置漂移拒绝与真实副作用次数。当前 delta spec
              可直接覆盖方案。
