              bind Plan Evidence to Tasks, strategy, binding, composition,
              topology, write scope, report ownership, validators, and risk; use
              a dependency matrix for precise invalidation; cover schema
              cutover, red-to-green domain/service/E2E tests, telemetry, desktop
              projection, and strict OpenSpec validation. Spec Patch: no new
              capability scope beyond the Open-corrected proposal and delta
              specs; design.md now supplies exact schemas, transitions, deletion
              list, and verification matrix."
