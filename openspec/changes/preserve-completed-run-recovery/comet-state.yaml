            handoffHash: be99934c311dfbb308ed83f0e73d80653cfde086fbd9c436694ba5f422671917
            proposal: 采用 Comet 0.5.1 的 completed 优先原则，并保持 Repoctopus 的
              Cordis/Service/RunStore 架构。先通过原 Store 读取、Journal 恢复和
              Run/Checkpoint 一致性取得可信完成事实，再在 coordinator、WorkflowRuns Service、完整
              status 和 CLI envelope 统一返回 done/terminal、空 Work/attempt/next
              actions，不再走活动定义、Skill、workspace、Evidence、Host 或通用项目
              reconciliation。历史全局标志保留为诊断，不手改
              Store、不伪造快照或重写完成记录；缺失、损坏、未结事务仍由原持久边界处理。活动 Run 的 Binding、能力、精确
              Evidence 失效和未知外部结果仍 fail closed。拒绝回写启动快照、增设终态 Work 或只修 UI
              的方案。验收覆盖真实 RED/GREEN、完整 Runtime/Service/CLI、多仓实际 Close/发布后的
              resume→next 与 next→resume、全部原回执和事件/调用计数，以及活动未授权 checkout
              和损坏持久状态负向回归。保持 Open 已批准的 8 项任务，无 Spec Patch，无新 schema/API/依赖，无
              Windows 长路径等额外修复。Build 配置建议 autonomous + TDD + thorough，沿用已批准
              worktree；配置尚待本次用户明确批准。唯一正式设计位于当前 Change 的 design.md。
