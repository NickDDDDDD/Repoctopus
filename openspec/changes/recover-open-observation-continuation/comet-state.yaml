              proposal: 采用单一纯 Work continuation
                classifier：WorkExecutionAuthority.recovery、WorkflowRuns.next、managed
                execution 与 next-action projection 共用同一状态分类；Open validated 固定投影为
                reobserve/open-gate-pending，并直接继续 planning gate，当次瞬时错误仍记录
                open-observation-unavailable。Project reconciliation 扩展为
                same/content/identity 与 requiresReconciliation；HEAD/worktree
                content drift 完整报告但交给各 phase authority
                精确重验，不设置全局阻塞；branch、remote、path、repository identity、topology
                或不可分类差异仍 fail closed。run resume 只恢复事务并投影 continuation，不执行
                Provider/Host。测试必须复现 strict validation 已成功后 planning observation
                失败的真实窗口，证明原
                Work、attempt、checkEpoch、Outcome、receipt、packet、invocation 与
                Skill consumption 不变，并回归真实 identity drift 仍阻断。
