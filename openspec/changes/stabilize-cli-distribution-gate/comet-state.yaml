            proposal: 采用 package-first + 显式源码 freshness preflight + 干净 CI：多仓验收默认从目标提交
              build/pack 后安装到隔离消费者目录；只有诊断未打包源码时才按 npm run build、node
              scripts/build.mjs --check、源码 CLI 顺序执行。新增只读权限的 PR/main/manual
              GitHub workflow，固定 Continuous integration / verify，运行 npm ci 与唯一权威
              npm run verify；用结构化 YAML 契约测试和自举文档测试保护触发器、权限、Node
              24、锁定安装、单一验证命令、package-first 与源码例外顺序。拒绝提交 dist（双重权威）和 launcher
              自动构建/本次 fail-closed 改造（启动副作用与范围膨胀）。主要风险是 CI 状态不等于 required
              check、完整验证耗时、源码例外仍需操作者遵守；通过明确平台管理边界、保留单一 verify 和把 package-first
              设为默认控制。已批准的 product-distribution Spec Patch 已包含 package-first 与源码
              freshness 场景，本候选不新增行为范围。
            requirementsEvidence:
              contentHash: 9315a0dbec833629eb5dc7f29398e2e52634f34ae423253cb31206a8cfd3ba08
              ref: openspec/changes/stabilize-cli-distribution-gate
