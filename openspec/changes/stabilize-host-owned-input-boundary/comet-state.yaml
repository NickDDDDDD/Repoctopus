            handoffHash: 085ac2a9c558ab44428343492ada8a66292268edc25fc3710fadbfa4929edd43
            proposal: 采用产品输入与执行控制面输入分区但共同绑定的方案：纯领域 Repository Input Policy 与 Cordis
              Contributor registry 负责默认拒绝分类，具体 Host 品牌只存在于 integration
              plugin；Git tracked 双用途文件保持产品输入，external-exclusive
              路径进入产品面时失败；未跟踪控制面文件形成 race-safe 内容寻址 manifest，未知文件仍是 product
              dirty；Evidence fingerprint manifest 直接升级 v2、Verification Input 升级
              v3，并沿用现有 Bundle/Gate/Archive 重验；架构脚本改为检查 Git、生产源码和发布包产品面，不依赖
              Runtime，也不再按物理 lstat 拒绝本地 Host 安装。拒绝仅扩充
              gitignore、宽泛跳过点目录、搬移目录和新增生命周期旁路。主要风险由 tracked
              优先、external-exclusive 规则、root
              containment、枚举上限、多仓归属和交叉契约测试控制；若插件体系无法安全表达
              Contributor、输入无法稳定内容寻址或需要 Archive 专用旁路，则停止并返回 Design。
            requirementsEvidence:
              contentHash: 2b65f6d2fb492fa3770e906968cb16d7c6cd25062224e21d20bf9674158a245f
              ref: openspec/changes/stabilize-host-owned-input-boundary
