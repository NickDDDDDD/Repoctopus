            proposal: 修订方案：独立 Verify 审查确认 POSIX recovered termination 只观察 leader PID，会在
              leader 消失但同一 process group 的 descendant 仍存活时错误返回
              terminated。采用同模块已有的 waitForPosixGroupExit：发送破坏性信号前继续用 leader
              creation identity 授权，发送后只以 kill(-pgid, 0) 返回 ESRCH 证明整组退出；超时或
              EPERM 保持 unknown。新增 leader-not-running/group-still-alive 的真实
              RED，并运行 terminate-process-tree 与 service-recovery 回归。拒绝在 ownership
              轮询上叠加第二套 group 算法，也拒绝枚举 /proc/ps。同步把已由 GitHub 失败证明的两项门禁决定写入唯一
              design.md：CI checkout 使用完整历史完成 tested commit
              ancestry；package-content v2 排除 host-derived tar mode，同时继续绑定
              path、entry type、file size/content digest 与 link target。仍
              skip_specs，不改变公共 API、Runtime 状态机、桌面支持范围或产品需求。主要风险是 process-group
              id 复用与权限未知，均通过短时有界 probe 并 fail closed 为 unknown；完成后重跑 Windows
              全量、GitHub Linux 精确 HEAD 和独立补审。
