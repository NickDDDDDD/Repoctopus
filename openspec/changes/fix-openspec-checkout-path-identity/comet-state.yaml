          output:
            handoffContext: openspec/changes/fix-openspec-checkout-path-identity/.comet/handoff/design-context.json
            handoffHash: 9d1cdb27cac5ac5b73e7634eacc892cf83f88b3792dad210382eb11f354c524f
            proposal: 已确认的范围：修复 Windows 路径别名导致同一 OpenSpec Store checkout 被误拒。保持 Open
              阶段的规格、显式 Store ID、健康根、批准边界和现有发布门禁。本轮无 Spec Patch。 候选方案： 1.
              平台适配层复用一种实际目录解析方式，Windows 使用能展开短路径和 junction 的原生
              realpath。核对实际目录时使用解析后的绝对路径，原输入用于必要的错误定位。无法解析的 Store 路径不能作为同一
              checkout 的证明，保留旧登记及对应的冲突诊断。 2. 规格 Provider 绑定实际 Workspace 后再核对显式
              Store context，统一其内部 primary Workspace 判断。保持 Archive 隔离 checkout
              的独立路径和授权，不将其命令路由到主 Store。 3. 项目探测基于实际 Workspace
              和扫描到的实际目录生成仓库相对路径。若同一实际目录在合法扫描范围内出现多次，只计一次。不同 checkout 仍按既有 Git
              身份冲突规则处理，扫描边界继续有效。登记状态、Doctor 和 Context 使用同一目录身份。 4. 新接入审批绑定已解析的
              Workspace，并按现有格式持久化到草稿和
              Intent。审核重新核对该绑定，保留常规文件、目录边界和候选摘要校验。别名改指、登记冲突和无法核验路径保持失败。无需迁移注册表或已保存的
              Run。 取舍：CI 临时路径规范化只能避开本次 runner 的触发方式，单纯路径字符串折叠也无法处理 Windows 短路径和
              junction。选择修复产品适配边界，复用固定 OpenSpec 的实际路径判断思路和 Comet 的 Windows
              原生解析做法，无第三方源码复制。 验证：用真实 CLI 和隔离的 OpenSpec registry
              做先失败后通过的测试。覆盖同一实际 checkout 的别名、不同
              checkout、失效路径、扫描别名和批准边界。验证普通接入、Store 冲突、Archive 隔离、真实 Windows
              tarball 与 npx。合入后由现有发布 workflow 从同一个通过 CI 的 main SHA 执行 Prepare 和
              Publish。
            requirementsEvidence:
              contentHash: 7813e903f8495f8a00e0bdf6aecfe659d507744fbe8eefcec0e6891658478679
              ref: openspec/changes/fix-openspec-checkout-path-identity
