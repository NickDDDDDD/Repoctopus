                proposal: 候选设计详见当前 change 的 design.md。独立 Node 入口 npm run
                  test:windows-multirepo-package-e2e 接收必填实际 tgz，在 Windows
                  隔离安装并通过公共 CLI 初始化 Workspace 和两个业务仓，执行同一 Change 的
                  Open、Design、Build、Verify、Archive。两个真实标记任务分别保留 RED/GREEN 和
                  Verify。首包持久化完成后驱动进程退出，第二进程恢复原 Run，核对原计划与首包完成身份及一次执行。夹具提供 Git
                  smart HTTP 与 GitHub 兼容 HTTPS，先持久化规格 PR 再断开创建响应并暂时隐藏查询结果，换进程
                  resume、next 和原发布入口维持 reconcile，恢复可见性后采纳同一 PR，核对全部原始创建请求、Git
                  receive-pack、远端 OID 与终态复读没有重复副作用。Prepare 以实际候选文件显式调用同一入口，seal
                  核对候选摘要、大小及包含关键检查的通过收据。诊断与收据独立于固定候选资产目录，失败保留诊断并阻止封存。候选作业预算 55
                  分钟，独立验收预算 15 分钟并有子命令超时和退出清理。独立审查确认无重要未决。采用三仓和上述预算为 Agent
                  建议，等待用户 Design 决定。测试 Host 使用隔离实验答复，当前验证覆盖 Windows 实包、Prepare
                  同参数接线和封存正反例，完整 GitHub Prepare 随合入后的下一份候选运行。无需 Spec Patch。
                requirementsEvidence:
                  contentHash: b8f838e24c96e3b06d41346afb4425f49cbf52fee2afeead672b84aa9e689334
                  ref: openspec/changes/verify-release-multirepo-workflow
