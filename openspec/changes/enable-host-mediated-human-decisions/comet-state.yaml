            proposal: 沿已批准的两项 capability 与十项任务，采用固定 Comet 0.5.1 的 Host-mediated 决策方式。新增只读
              run decision 和 run decide --response-file 显式回传；未指定文件保留原终端
              TTY。视图提供冻结身份、允许选择、条件输入、响应模板和下一步 argv。Host 取得真实原生或对话答复，CLI
              记录本机主体及分离的渠道/授权依据，不自称独立证明用户点击；Runtime 复用规划批准、Provider/isolation
              校验和现有 guarded commit。覆盖 Open、Design、意图修订及 Build Plan 风险决定；保留
              change/phase 级共享规划批准，查询/提交先证明指定 Run 的请求参与事实，不凭同名 change
              冒领。原始接受事实和来源保存在既有规划记录或转换 Journal，不新增审批
              Store、Runtime、SDK、守护进程、Dashboard 写入或 checkpoint
              迁移；中断先核对原决定，重复提交不重复推进。真实 TDD
              回归、独立安装包多仓测试及至少一次真实宿主原生问答闭环为验收；模拟不能替代真实 UI。独立 builder check
              的唯一归属问题已澄清并复核无重要未决。无需 Spec Patch，尚未实施或宣称新测试通过。建议本次开发采用 autonomous
              + TDD + thorough，沿用当前独立 worktree；正式设计及执行配置等待用户确认。
