            proposal: 方案：在 Run Store 首次写入前，由纯领域 ChangeStartBinding 从 Workspace Repository 与
              target facts 派生稳定语义绑定；绑定只包含
              repository/remote/topology/source/target，排除 path、HEAD、worktree
              与时间。Coordinator startOrResume 返回强类型 started|resumed disposition，只有
              started 记录初始 Skill、Work 与首次 activation；resumed 使用 Store 中的
              authoritative Work。Open observation 区分 strict invalid、Provider
              暂时不可用和 Host 外部结果未知：暂时不可用在原 Outcome/attempt/invocation 上
              reobserve，不调用 Host reconcile。创建前拒绝写 canonical observation
              outbox，已有 Run 的复用、冲突和重观察从 trajectory 投影。Runner 仍负责
              branch/worktree，Runtime 不执行 Git checkout。
