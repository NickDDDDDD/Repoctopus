            handoffHash: fc1f8df912a71d2b5d8713415d69d8f75a9cbe263185b53c3e4e1e0f587c5a43
            proposal: "按已批准的 Open 范围修复 #120，无 Spec Patch。候选详见
              .comet/handoff/brainstorm-summary.md。首次可信 Verify
              实现失败仍按原规则做局部自动返工。若下一轮的声明输入、所消费上游产物的有效输入、验收集合和失败范围相同，Runtime 原子记录同一
              Verify Work 的人工等待，保留 epoch、机器 Attempt、Host 审查和有效包完成事实。机器检查前绑定
              Attempt，结果已写入但等待尚未提交时冷恢复也复用原证据。公开读取和执行入口以同一等待为准。现有 run decision /
              run decide 协议接受针对这次失败的明确决定，原子消费决定并沿 revise-implementation 派发普通
              Build Plan，每次只授权一轮。仍没有进展时再次暂停并允许针对新证据决定。真实声明输入变化按 Evidence
              失效路径重新观察，旧答复不再有效，规划和权限仍按既有规则处理。测试包括生产命令、证据写入后的断点、派生依赖变更、并发答复和
              Windows 五仓实际安装包。建议独立 worktree，autonomous + TDD +
              thorough。关键风险是派生输入漏计、抢占 Attempt 和等待答复重放，用现有 Evidence 和 Lifecycle
              守卫约束；不增加旧 Run 迁移。"
