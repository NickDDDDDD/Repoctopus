              后重新核对 planning manifest identity；Evidence Coordinator 提供不计算仓库
              fingerprint 的 compile 入口；Design 与正式 Verify 复用同一纯
              resolver。拒绝两个替代方案：仅在 Build Check 后校验仍然过晚；在接入阶段强制所有 Profile 或猜测细粒度
              selector 会混淆独立 Evidence Profile 并伪造未来语义。
