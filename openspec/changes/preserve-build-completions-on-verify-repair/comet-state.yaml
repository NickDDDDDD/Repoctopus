            proposal: 按已批准的十项任务实施选择性 Verify 返工：保留 Plan→Execute→Check→Verify。Runtime 从失败
              Bundle 的 Acceptance Trace、当前 Plan 与依赖闭包计算影响范围，使用未受影响机器 Receipt
              的真实输入/产物证明保留原 completion。相同内容 Plan 复用原身份，真实计划变化才新 revision；Task
              已完成的修复仍使用普通 Execute。增加 Work 权威的内部 revise-implementation 分类，不改
              continue-build 同 Work retry 语义，不新增阶段/Work kind。Build Protocol 使用单一
              schema 3 保存修复依据，原 Package Completion 和 Host result 结构不改；不支持旧开发
              checkpoint 迁移。未知范围或证明不可观察稳定阻断，全局影响有依据时允许全量重验。Plan/Execute/Check 的
              CAS 接受前重验依赖，保证跨进程恢复不重放。沿既有 Trace/OTLP 记录真实原因和保留/失效数量。只读 builder
              check 无重大未决问题；尚未实施或宣称新回归通过。不修改已批准 delta specs，不引入第三方代码/依赖或新配置开关。本
              Change 建议采用 autonomous、TDD、thorough，沿用已批准 worktree；执行配置仍等待用户明确选择。
