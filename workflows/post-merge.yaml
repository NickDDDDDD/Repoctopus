apiVersion: repoctopus/v1alpha1
kind: Workflow
metadata:
  name: post-merge
  version: 1.0.0
  description: 基于权威合入事实执行可恢复的规格收尾与 Change MR 发布
entry: checkout
steps:
  - id: checkout
    action:
      type: call_tool
      ref: post-merge.checkout-exact-commits
      summary: 在隔离目录检出全部业务 MR 的精确 merge commit
    onSuccess: evidence
    onFailure: checkout
  - id: evidence
    action:
      type: call_tool
      ref: post-merge.collect-evidence
      summary: 对精确合入代码运行合入后 Evidence Profile
      evidenceProfile: post-merge
    onSuccess: close-specification
    onFailure: evidence
  - id: close-specification
    action:
      type: call_tool
      ref: post-merge.close-specification
      summary: 准备并执行规格同步与 change 关闭
    onSuccess: audit-paths
    onFailure: close-specification
  - id: audit-paths
    action:
      type: call_tool
      ref: post-merge.audit-paths
      summary: 按关闭计划执行路径与内容类型双重审计
    onSuccess: publish
    onFailure: audit-paths
  - id: publish
    action:
      type: call_tool
      ref: post-merge.publish-change
      summary: 创建普通收尾 commit 并更新原 Change MR 分支与元数据
    onSuccess: null
    onFailure: publish
guardrails:
  allowedActionTypes:
    - call_tool
  allowedRefs:
    - post-merge.checkout-exact-commits
    - post-merge.collect-evidence
    - post-merge.close-specification
    - post-merge.audit-paths
    - post-merge.publish-change
  confirmationRequiredFor: []
  maxIterations: 10
  maxRetriesPerAction: 3
