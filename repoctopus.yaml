apiVersion: repoctopus/v1alpha1
kind: RepoctopusWorkspace
workspace:
  id: repoctopus
  repositoryId: repoctopus
repositories:
  - id: repoctopus
    path: .
composition:
  plugins: []
profiles:
  - id: verify
    nodes:
      - id: typecheck
        type: command
        repository: repoctopus
        executable: npm
        args: [run, typecheck]
        timeoutMs: 120000
      - id: architecture
        type: command
        repository: repoctopus
        dependsOn: [typecheck]
        executable: npm
        args: [run, check:architecture]
        timeoutMs: 120000
  - id: recovery-probe
    nodes:
      - id: interrupted-command
        type: command
        repository: repoctopus
        executable: node
        args: [-e, 'setTimeout(() => process.exit(0), 30000)']
        timeoutMs: 60000
  - id: post-merge
    nodes:
      - id: install-dependencies
        type: command
        repository: repoctopus
        executable: npm
        args: [ci]
        timeoutMs: 300000
      - id: verify-merged-code
        type: command
        repository: repoctopus
        dependsOn: [install-dependencies]
        executable: npm
        args: [run, verify]
        timeoutMs: 300000
evidence:
  retention:
    maxAgeDays: 30
    minRecentSuccesses: 1
delivery:
  checkpoint:
    automatic: true
    protectedBranches: [main, master, 'release/*']
    commitMessagePattern: '^(feat|fix|docs|refactor|test|chore)(\([a-z0-9-]+\))?: .+'
    quickChecks:
      '*': []
  publication:
    remote: origin
    provider: github
    githubApiBaseUrl: https://api.github.com
    mrTitleTemplate: '{{changeId}}'
    mrBodyTemplate: '{{verificationReport}}'
platformEvents:
  storeProvider:
    id: platform-events-file
  http:
    hostname: 127.0.0.1
    port: 7341
    shutdownTimeoutMs: 5000
  github:
    source: primary
    path: /webhooks/github
    maxBodyBytes: 1048576
    webhookCredential:
      provider: environment
      variable: REPOCTOPUS_GITHUB_WEBHOOK_SECRET
    apiCredential:
      provider: environment
      variable: REPOCTOPUS_GITHUB_TOKEN
  runner:
    identity: primary-runner
    leaseMs: 30000
    pollIntervalMs: 1000
    retryDelayMs: 1000
    maxAttempts: 5
    shutdownTimeoutMs: 5000
postMerge:
  runnerIdentity: primary-runner
  temporaryRoot: .repoctopus/post-merge-checkouts
  evidenceProfile: post-merge
  allowedWorkspacePaths:
    specificationClosure: true
    verificationPathPrefixes: []
  publication:
    operations: [merge_target, commit, push, merge_request.create_or_recover]
    remote: origin
    commit:
      message: 'chore(spec): close verified change'
      authorNameCredential:
        provider: environment
        variable: REPOCTOPUS_GIT_AUTHOR_NAME
      authorEmailCredential:
        provider: environment
        variable: REPOCTOPUS_GIT_AUTHOR_EMAIL
    finalChangeMergeRequest:
      title: 'Close verified specification'
      body: 'Post-merge verification and specification closure completed.'
