apiVersion: repoctopus/v1alpha1
kind: RepoctopusWorkspace
workspace:
  id: repoctopus
  repositoryId: repoctopus
repositories:
  - id: repoctopus
    path: .
composition:
  plugins: []
profiles:
  - id: verify
    nodes:
      - id: full-verify
        type: command
        repository: repoctopus
        covers: ['*']
        inputs: &source-inputs
          schemaVersion: 1
          git: all
          repositories:
            - repository: repoctopus
              files:
                - app/**
                - bin/**
                - domains/**
                - platform/**
                - plugins/**
                - services/**
                - scripts/**
                - test/**
                - skills/**
                - workflows/**
                - third_party/**
                - docs/**
                - openspec/**
                - deploy/**
                - verification/**
                - README.md
                - package.json
                - package-lock.json
                - repoctopus.yaml
                - tsconfig.json
                - eslint.config.js
                - vitest.config.ts
                - electron-builder.json
        executable: npm
        args: [run, verify]
        timeoutMs: 1800000
      - id: package-e2e
        type: command
        repository: repoctopus
        dependsOn: [full-verify]
        covers: ['*']
        inputs: *source-inputs
        executable: npm
        args: [run, test:package-e2e]
        timeoutMs: 600000
      - id: tracer-e2e
        type: command
        repository: repoctopus
        dependsOn: [package-e2e]
        covers: ['*']
        inputs: *source-inputs
        executable: npm
        args: [run, test:tracer-e2e]
        timeoutMs: 600000
      - id: production-audit
        type: command
        repository: repoctopus
        dependsOn: [tracer-e2e]
        covers: ['*']
        inputs: *source-inputs
        executable: npm
        args: [audit, --omit=dev]
        timeoutMs: 300000
  - id: recovery-probe
    nodes:
      - id: interrupted-command
        type: command
        repository: repoctopus
        inputs: *source-inputs
        executable: node
        args: [-e, 'setTimeout(() => process.exit(0), 30000)']
        timeoutMs: 60000
evidence:
  retention:
    maxAgeDays: 30
    minRecentSuccesses: 1
delivery:
  checkpoint:
    automatic: true
    protectedBranches: [main, master, 'release/*']
    commitMessagePattern: '^(feat|fix|docs|refactor|test|chore)(\([a-z0-9-]+\))?: .+'
    quickChecks:
      '*': []
  publication:
    remote: origin
    provider: github
    githubApiBaseUrl: https://api.github.com
    mrTitleTemplate: '{{changeId}}'
    mrBodyTemplate: '{{verificationReport}}'
    apiCredential:
      provider: environment
      variable: REPOCTOPUS_GITHUB_TOKEN
